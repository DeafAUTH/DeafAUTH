services:
  deafauth:
    image: denoland/deno:2.2.6
    command: run --allow-net --allow-env --allow-read identity/service.ts
    environment:
      - PORT=8443
      - TLS_CERT=/certs/fullchain.pem
      - TLS_KEY=/certs/privkey.pem
    ports:
      - "8443:8443"
  pinksync:
    image: denoland/deno:2.2.6
    command: run --allow-net --allow-env pinksync/gateway.ts
    environment:
      - PORT=8080
      - TLS_CERT=/certs/fullchain.pem
      - TLS_KEY=/certs/privkey.pem
    ports:
      - "8080:8080"